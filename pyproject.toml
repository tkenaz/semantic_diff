[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-diff"
version = "0.5.1"
description = "AI-powered semantic analysis and agentic review of git commits and merge requests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "37lab OÜ", email = "mv@37lab.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.58",  # CVE-2026-42215, -44243 and later fixes
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "openai>=1.40.0",
    "mutmut>=3.0.0",
    "pyyaml",  # tests execute action.yml steps
    "httpx",  # tests build SDK errors from real responses; newer SDKs ship httpx2
]

[project.scripts]
semantic-diff = "semantic_diff.cli:cli"

[project.urls]
Homepage = "https://github.com/tkenaz/semantic_diff"
Repository = "https://github.com/tkenaz/semantic_diff"

[tool.setuptools.packages.find]
include = ["semantic_diff*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mutmut]
paths_to_mutate = ["semantic_diff/"]
tests_dir = ["tests/"]
also_copy = ["action.yml", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
