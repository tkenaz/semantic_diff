name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Check formatting
        run: black --check semantic_diff tests

      - name: Lint
        run: ruff check semantic_diff tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=semantic_diff --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Self-review: semantic-diff reviews its own pull requests through its own
  # action, at the PR's code. Skip on forks (no access to secrets) and dependabot
  semantic-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The reviewer reads the base of the change too

      - name: Skip without a key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::semantic-diff: ANTHROPIC_API_KEY not configured, skipping self-review"

      # Advisory, not a gate (see README, "Model matters"): it comments, never
      # fails, not even when the API or the CLI does
      - name: Review this PR
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        uses: ./
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          review: 'true'
          fail_on_risk: 'never'
