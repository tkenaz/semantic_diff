name: 'Semantic Diff'
description: 'AI-powered semantic analysis of pull requests and commits. Understand intent, assess risk, get review questions.'
author: 'Kenaz GmbH'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true

  model:
    description: 'Model to use (any Anthropic model id, e.g. claude-sonnet-5-5)'
    required: false
    default: 'claude-sonnet-5-5'

  fail_on_risk:
    description: 'Fail the check if risk level meets or exceeds this (low, medium, high, critical, never)'
    required: false
    default: 'never'

  comment_on_pr:
    description: 'Post analysis as PR comment'
    required: false
    default: 'true'

  base_ref:
    description: 'Base ref for comparison (default: auto-detect from PR)'
    required: false
    default: ''

outputs:
  risk_level:
    description: 'Overall risk level (low, medium, high, critical)'
    value: ${{ steps.analyze.outputs.risk_level }}

  analysis_json:
    description: 'Full analysis as JSON'
    value: ${{ steps.analyze.outputs.analysis_json }}

  report_path:
    description: 'Path to saved markdown report'
    value: ${{ steps.analyze.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install semantic-diff
      shell: bash
      env:
        # Install the CLI from the same repo+ref the action itself runs at,
        # so action.yml and the CLI can never drift apart (PyPI lags: it
        # carries 0.1.0, whose CLI lacks --save — the v0.2.0 CI breakage).
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        pip install "git+https://github.com/${ACTION_REPO:-tkenaz/semantic_diff}@${ACTION_REF:-main}"

    - name: Run semantic-diff
      id: analyze
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SEMANTIC_DIFF_MODEL: ${{ inputs.model }}
        # Event data reaches the script only as env: never as ${{ }} in run
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        # One LLM call: JSON on stdout, report saved, diagnostics on stderr
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # The whole PR from the merge base (needs actions/checkout fetch-depth: 0)
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_description.md"
          ANALYSIS=$(semantic-diff mr --base "${BASE_REF_INPUT:-$PR_BASE_SHA}" --head "$PR_HEAD_SHA" \
            --title "$PR_TITLE" --description-file "$RUNNER_TEMP/pr_description.md" --json --save)
        else
          ANALYSIS=$(semantic-diff analyze "$PUSH_SHA" --json --save)
        fi

        echo "$ANALYSIS" > "$RUNNER_TEMP/semantic_diff_analysis.json"

        RISK_LEVEL=$(echo "$ANALYSIS" | jq -r '.risk_assessment.overall_risk')
        echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

        DELIMITER="EOF_$(date +%s%N)"
        {
          echo "analysis_json<<$DELIMITER"
          echo "$ANALYSIS"
          echo "$DELIMITER"
        } >> "$GITHUB_OUTPUT"

        REPORT_PATH=$(ls -t semantic_diff_reports/*.md | head -1)
        echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const analysis = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/semantic_diff_analysis.json`, 'utf8'));

          const riskEmoji = {
            'low': '✅',
            'medium': '⚠️',
            'high': '🔶',
            'critical': '🔴'
          };

          const risk = analysis.risk_assessment.overall_risk;
          const emoji = riskEmoji[risk] || '❓';

          let body = `## ${emoji} Semantic Diff Analysis\n\n`;
          body += `**Risk Level:** ${risk.toUpperCase()}\n\n`;

          body += `### 🎯 Intent\n`;
          body += `${analysis.intent.summary}\n\n`;
          body += `*Confidence: ${Math.round(analysis.intent.confidence * 100)}%*\n\n`;

          const cov = analysis.diff_coverage;
          if (cov && cov.percent < 100) {
            body += `> Diff coverage: ${cov.percent}% of changed lines; `;
            body += `${cov.omitted.length} file(s) not shown to the model\n\n`;
          }

          if (analysis.risk_assessment.risks.length > 0) {
            body += `### ⚠️ Risks\n`;
            for (const r of analysis.risk_assessment.risks) {
              body += `- **[${r.severity}]** ${r.description}\n`;
              if (r.mitigation) {
                body += `  - 💡 ${r.mitigation}\n`;
              }
            }
            body += '\n';
          }

          if (analysis.review_questions.length > 0) {
            body += `### ❓ Review Questions\n`;
            for (const q of analysis.review_questions.slice(0, 5)) {
              body += `- ${q.question}\n`;
            }
            body += '\n';
          }

          body += `---\n*Analyzed by [semantic-diff](https://github.com/tkenaz/semantic_diff)*`;

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const botComment = comments.find(c =>
            c.body.includes('Semantic Diff Analysis') &&
            c.user.type === 'Bot'
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Check risk threshold
      if: inputs.fail_on_risk != 'never'
      shell: bash
      env:
        RISK: ${{ steps.analyze.outputs.risk_level }}
        THRESHOLD: ${{ inputs.fail_on_risk }}
      run: |

        # Risk levels in order
        declare -A RISK_ORDER=( ["low"]=1 ["medium"]=2 ["high"]=3 ["critical"]=4 )

        RISK_NUM=${RISK_ORDER[$RISK]}
        THRESHOLD_NUM=${RISK_ORDER[$THRESHOLD]}

        if [ "$RISK_NUM" -ge "$THRESHOLD_NUM" ]; then
          echo "::error::Risk level $RISK meets or exceeds threshold $THRESHOLD"
          exit 1
        fi

        echo "Risk level $RISK is below threshold $THRESHOLD"
