name: 'Semantic Diff'
description: 'AI-powered semantic analysis of pull requests and commits. Understand intent, assess risk, get review questions.'
author: '37lab OÜ'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true

  model:
    description: 'Model to use: any Anthropic model id. Default claude-sonnet-5-5; pick claude-opus-5-5 for deeper reviews of larger PRs.'
    required: false
    default: 'claude-sonnet-5-5'

  fail_on_risk:
    description: 'Fail the check if risk level meets or exceeds this (low, medium, high, critical, never). With review: true it reads the cited findings only — uncited observations never fail the check.'
    required: false
    default: 'never'

  comment_on_pr:
    description: 'Post analysis as PR comment'
    required: false
    default: 'true'

  review:
    description: 'Run the agentic reviewer on pull requests (reads the code around the change; findings split into cited and uncited) instead of the one-shot analysis'
    required: false
    default: 'false'

  rules_path:
    description: 'Path to a rule corpus checkout (INDEX.md + rules/*.md) that cited findings must reference; empty means every finding is an uncited observation'
    required: false
    default: ''

  base_ref:
    description: 'Base ref for comparison (default: auto-detect from PR)'
    required: false
    default: ''

outputs:
  risk_level:
    description: 'Risk level (low, medium, high, critical; with review: true from cited findings only, "none" without any, "incomplete" when the reviewer never submitted)'
    value: ${{ steps.analyze.outputs.risk_level }}

  verdict:
    description: 'Review verdict (approve, comment, request_changes); only with review: true'
    value: ${{ steps.analyze.outputs.verdict }}

  analysis_json:
    description: 'Full analysis as JSON'
    value: ${{ steps.analyze.outputs.analysis_json }}

  report_path:
    description: 'Path to saved markdown report'
    value: ${{ steps.analyze.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install semantic-diff
      shell: bash
      env:
        # Install the CLI from the same repo+ref the action itself runs at,
        # so action.yml and the CLI can never drift apart (PyPI can lag the
        # tag: in v0.2.0 it still carried 0.1.0, whose CLI lacked --save).
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        # A local action (uses: ./) has neither: install the checkout it runs from
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$ACTION_REPO" ]; then
          pip install "$ACTION_PATH"
        else
          pip install "git+https://github.com/${ACTION_REPO}@${ACTION_REF}"
        fi

    - name: Run semantic-diff
      id: analyze
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SEMANTIC_DIFF_MODEL: ${{ inputs.model }}
        # Event data reaches the script only as env: never as ${{ }} in run
        EVENT_NAME: ${{ github.event_name }}
        REVIEW: ${{ inputs.review }}
        RULES_PATH: ${{ inputs.rules_path }}
        BASE_REF_INPUT: ${{ inputs.base_ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        # One LLM run: JSON on stdout, report saved, diagnostics on stderr
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # The whole PR from the merge base (needs actions/checkout fetch-depth: 0)
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_description.md"
          RANGE_ARGS=(--base "${BASE_REF_INPUT:-$PR_BASE_SHA}" --head "$PR_HEAD_SHA" \
            --title "$PR_TITLE" --description-file "$RUNNER_TEMP/pr_description.md")
          if [ "$REVIEW" = "true" ]; then
            # Agentic review. The gate value (risk_level) comes from cited
            # findings only; uncited observations never flip pass to fail.
            RULES_ARGS=()
            if [ -n "$RULES_PATH" ]; then
              RULES_ARGS=(--rules "$RULES_PATH")
            fi
            ANALYSIS=$(semantic-diff review "${RANGE_ARGS[@]}" "${RULES_ARGS[@]}" --json --save)
            # A review the model never submitted (a limit cut it short) has no
            # findings at all: "incomplete", which fails any gate, never "none"
            RISK_LEVEL=$(echo "$ANALYSIS" | jq -r \
              'if .stats.submitted == true then (.risk_level // "none") else "incomplete" end')
            echo "verdict=$(echo "$ANALYSIS" | jq -r '.verdict // "none"')" >> "$GITHUB_OUTPUT"
          else
            ANALYSIS=$(semantic-diff mr "${RANGE_ARGS[@]}" --json --save)
            RISK_LEVEL=$(echo "$ANALYSIS" | jq -r '.risk_assessment.overall_risk')
          fi
        else
          ANALYSIS=$(semantic-diff analyze "$PUSH_SHA" --json --save)
          RISK_LEVEL=$(echo "$ANALYSIS" | jq -r '.risk_assessment.overall_risk')
        fi

        echo "$ANALYSIS" > "$RUNNER_TEMP/semantic_diff_analysis.json"

        echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

        DELIMITER="EOF_$(date +%s%N)"
        {
          echo "analysis_json<<$DELIMITER"
          echo "$ANALYSIS"
          echo "$DELIMITER"
        } >> "$GITHUB_OUTPUT"

        REPORT_PATH=$(ls -t semantic_diff_reports/*.md | head -1)
        echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

    - name: Comment review on PR
      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' && inputs.review == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/semantic_diff_analysis.json`, 'utf8'));

          // Everything the model wrote may quote the PR author's content: no
          // HTML, no @-mentions, no links or images (a prompt-injected diff could
          // plant a tracking pixel); one-line fields stay on one line, code spans closed
          const esc = (text) => String(text ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/@/g, '@\u200b')
            .replace(/[\[\]]/g, '\\$&')
            .replace(/\b(https?|ftp|www)(:|\.)/gi, '$1\u200b$2');
          const line = (text) => esc(text).replace(/\s+/g, ' ').trim();
          // Code spans render no HTML or mentions: only keep them on one line and closed
          const code = (text) => `\`${String(text ?? '').replace(/\s+/g, ' ').trim().replace(/`/g, "'")}\``;

          const icons = { low: '✅', medium: '⚠️', high: '🔶', critical: '🔴' };
          const risk = report.stats.submitted ? (report.risk_level || 'none') : 'incomplete';
          const verdict = (report.verdict || 'not submitted').replace('_', ' ');
          const where = (f) => code(`${f.file}:${f.line}`);

          let body = `## 🔍 Semantic Diff Review\n\n`;
          body += `**Verdict:** ${verdict} · **Gate risk:** ${risk} `;
          body += `*(from cited findings only; uncited observations never gate)*\n\n`;
          body += `### Summary\n${esc(report.summary)}\n\n`;

          if (report.findings.length > 0) {
            body += `### Findings (cited)\n`;
            for (const f of report.findings) {
              body += `- ${icons[f.severity] || ''} **[${f.severity}]** ${where(f)} ${line(f.title)}`;
              body += ` — ${code(f.rule_id)}, ${line(f.source)}\n`;
            }
            body += '\n';
          }

          if (report.uncited.length > 0) {
            body += `<details><summary>Uncited observations (${report.uncited.length}) — `;
            body += `informational, never gate</summary>\n\n`;
            for (const f of report.uncited) {
              body += `- **[${f.severity}]** ${where(f)} ${line(f.title)}\n`;
            }
            body += `\n</details>\n\n`;
          }

          const cov = report.diff_coverage;
          if (cov && cov.percent < 100) {
            body += `> Diff coverage: ${cov.percent}% of changed lines shown up front\n\n`;
          }
          if (!report.stats.submitted) {
            body += `> ⚠ Incomplete review: the model did not submit a review.\n\n`;
          }

          body += `---\n*Reviewed by [semantic-diff](https://github.com/tkenaz/semantic_diff) (${report.review_model})*`;

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const botComment = comments.find(c =>
            c.body.includes('Semantic Diff Review') &&
            c.user.type === 'Bot'
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Comment on PR
      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request' && inputs.review != 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const analysis = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/semantic_diff_analysis.json`, 'utf8'));

          const riskEmoji = {
            'low': '✅',
            'medium': '⚠️',
            'high': '🔶',
            'critical': '🔴'
          };

          const risk = analysis.risk_assessment.overall_risk;
          const emoji = riskEmoji[risk] || '❓';

          let body = `## ${emoji} Semantic Diff Analysis\n\n`;
          body += `**Risk Level:** ${risk.toUpperCase()}\n\n`;

          body += `### 🎯 Intent\n`;
          body += `${analysis.intent.summary}\n\n`;
          body += `*Confidence: ${Math.round(analysis.intent.confidence * 100)}%*\n\n`;

          const cov = analysis.diff_coverage;
          if (cov && cov.percent < 100) {
            body += `> Diff coverage: ${cov.percent}% of changed lines; `;
            body += `${cov.omitted.length} file(s) not shown to the model\n\n`;
          }

          if (analysis.risk_assessment.risks.length > 0) {
            body += `### ⚠️ Risks\n`;
            for (const r of analysis.risk_assessment.risks) {
              body += `- **[${r.severity}]** ${r.description}\n`;
              if (r.mitigation) {
                body += `  - 💡 ${r.mitigation}\n`;
              }
            }
            body += '\n';
          }

          if (analysis.review_questions.length > 0) {
            body += `### ❓ Review Questions\n`;
            for (const q of analysis.review_questions.slice(0, 5)) {
              body += `- ${q.question}\n`;
            }
            body += '\n';
          }

          body += `---\n*Analyzed by [semantic-diff](https://github.com/tkenaz/semantic_diff)*`;

          // Find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const botComment = comments.find(c =>
            c.body.includes('Semantic Diff Analysis') &&
            c.user.type === 'Bot'
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Check risk threshold
      if: inputs.fail_on_risk != 'never'
      shell: bash
      env:
        RISK: ${{ steps.analyze.outputs.risk_level }}
        THRESHOLD: ${{ inputs.fail_on_risk }}
      run: |

        # Risk levels in order; "none" (a review without cited findings) is 0
        # and never gates. Uncited observations do not reach this step at all.
        level() {
          case "$1" in
            low) echo 1 ;;
            medium) echo 2 ;;
            high) echo 3 ;;
            critical) echo 4 ;;
            *) echo 0 ;;
          esac
        }

        RISK_NUM=$(level "$RISK")
        THRESHOLD_NUM=$(level "$THRESHOLD")

        if [ "$THRESHOLD_NUM" -eq 0 ]; then
          echo "::error::Unknown fail_on_risk threshold: $THRESHOLD"
          exit 1
        fi

        # Nothing was checked, so nothing can pass: fail closed
        if [ "$RISK" = "incomplete" ]; then
          echo "::error::The review is incomplete (the reviewer never submitted): failing the check"
          exit 1
        fi

        if [ "$RISK_NUM" -ge "$THRESHOLD_NUM" ]; then
          echo "::error::Risk level $RISK meets or exceeds threshold $THRESHOLD"
          exit 1
        fi

        echo "Risk level $RISK is below threshold $THRESHOLD"
